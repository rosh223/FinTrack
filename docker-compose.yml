services:
  db:
    image: postgres:16-alpine
    container_name: fintrack-postgres
    environment:
      POSTGRES_DB: fintrack_db
      POSTGRES_USER: fintrack_user
      POSTGRES_PASSWORD: fintrack_password
    ports:
      - "5432:5432"
    volumes:
      - fintrack-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fintrack-data:
