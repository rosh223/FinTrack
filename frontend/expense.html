<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Expenses</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <div class="main-content">
            <div class="flex-between mb-3">
                <h1>Expense Management</h1>
                <button class="btn" style="width: auto;" id="showAddFormBtn">Add Expense</button>
            </div>
            
            <div class="card" id="expenseFormCard" style="display: none;">
                <h2 id="formTitle">Add New Expense</h2>
                <div id="formError" class="error-msg mb-3"></div>
                <form id="expenseForm">
                    <input type="hidden" id="expenseId">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="expenseTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" id="expenseAmount" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="expenseDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="expenseCategory" class="form-control" required>
                            <option value="">Select Category</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="expenseDesc" class="form-control">
                    </div>
                    <div class="flex-between mt-3">
                        <button type="button" class="btn btn-secondary" style="width: 48%;" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn" style="width: 48%;">Save</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>Expense History</h2>
                <div class="table-responsive mt-3">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTable">
                            <tr>
                                <td colspan="5" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/expense.js"></script>
</body>
</html>
