<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Income</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <div class="main-content">
            <div class="flex-between mb-3">
                <h1>Income Management</h1>
                <button class="btn" style="width: auto;" id="showAddFormBtn">Add Income</button>
            </div>
            
            <div class="card" id="incomeFormCard" style="display: none;">
                <h2 id="formTitle">Add New Income</h2>
                <div id="formError" class="error-msg mb-3"></div>
                <form id="incomeForm">
                    <input type="hidden" id="incomeId">
                    <div class="form-group">
                        <label>Source</label>
                        <input type="text" id="incomeSource" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" id="incomeAmount" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="incomeDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="incomeDesc" class="form-control">
                    </div>
                    <div class="flex-between mt-3">
                        <button type="button" class="btn btn-secondary" style="width: 48%;" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn" style="width: 48%;">Save</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>Income History</h2>
                <div class="table-responsive mt-3">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Source</th>
                                <th>Amount</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="incomeTable">
                            <tr>
                                <td colspan="5" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/income.js"></script>
</body>
</html>
