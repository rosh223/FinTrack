<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Reports</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <div class="main-content">
            <h1>Reports & Analysis</h1>
            
            <div class="card mt-3">
                <h2>Category-wise Spending Summary</h2>
                <div class="flex-between mt-3" style="max-width: 400px;">
                    <div class="form-group" style="width: 48%;">
                        <label>Month</label>
                        <select id="reportMonth" class="form-control">
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div class="form-group" style="width: 48%;">
                        <label>Year</label>
                        <input type="number" id="reportYear" class="form-control" min="2000">
                    </div>
                </div>

                <div class="table-responsive mt-3">
                    <table>
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Total Spent</th>
                                <th>% of Total Monthly Spend</th>
                            </tr>
                        </thead>
                        <tbody id="reportTable">
                            <tr>
                                <td colspan="3" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
