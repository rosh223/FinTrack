<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Budget</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <div class="main-content">
            <h1>Budget Management</h1>
            
            <div class="card mt-3" style="max-width: 500px;">
                <h2>Set Monthly Budget</h2>
                <div id="formError" class="error-msg mb-3"></div>
                <div id="formSuccess" style="color: var(--success-color);" class="mb-3"></div>
                <form id="budgetForm">
                    <div class="form-group">
                        <label>Month</label>
                        <select id="budgetMonth" class="form-control" required>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="budgetYear" class="form-control" min="2000" required>
                    </div>
                    <div class="form-group">
                        <label>Budget Amount</label>
                        <input type="number" id="budgetAmount" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <button type="submit" class="btn mt-3">Set Budget</button>
                </form>
            </div>

            <div class="dashboard-cards mt-3">
                <div class="card stat-card">
                    <h3>Budget Amount</h3>
                    <p id="currentBudgetAmount">$0.00</p>
                </div>
                <div class="card stat-card">
                    <h3>Total Spending</h3>
                    <p id="totalSpending" style="color: var(--danger-color);">$0.00</p>
                </div>
                <div class="card stat-card">
                    <h3>Remaining Budget</h3>
                    <p id="remainingBudget">$0.00</p>
                </div>
                <div class="card stat-card">
                    <h3>Usage</h3>
                    <p id="usagePercentage">0%</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/budget.js"></script>
</body>
</html>
