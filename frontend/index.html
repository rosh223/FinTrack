<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" id="loginCard">
            <h2>FinTrack Login</h2>
            <div id="loginError" class="error-msg text-center mb-3"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn mt-3">Login</button>
                <p class="text-center mt-3">Don't have an account? <a href="#" id="showRegister">Register</a></p>
            </form>
        </div>

        <div class="auth-card" id="registerCard" style="display: none;">
            <h2>Create Account</h2>
            <div id="registerError" class="error-msg text-center mb-3"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="registerName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" class="form-control" minlength="6" required>
                </div>
                <button type="submit" class="btn mt-3">Register</button>
                <p class="text-center mt-3">Already have an account? <a href="#" id="showLogin">Login</a></p>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
